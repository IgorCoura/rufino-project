name: bill_payment
description: "Contas a pagar: captura, verificação, aprovação e expectativas."
publish_to: 'none'
version: 0.1.0

# Este pacote NÃO declara `people_management`, e é isso que garante o isolamento
# entre os dois produtos: importar de lá vira erro de compilação, não questão de
# disciplina. O que os dois precisam dividir sobe para `rufino_core`.
resolution: workspace

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  rufino_core: ^0.1.0
  # Mesmo conjunto de estado/DI/rotas do resto do app — a casca compõe os três.
  provider: ^6.1.2
  go_router: ^14.6.2
  http: ^1.2.2
  # MediaType do multipart do anexo manual. Já vinha transitivo pelo `http`;
  # declarado porque o código o usa direto — depender de transitiva quebra em silêncio.
  http_parser: ^4.0.2
  intl: ^0.19.0
  mask_text_input_formatter: ^2.9.0
  material_symbols_icons: ^4.2719.1
  # O visualizador de PDF fica NESTE pacote, não em rufino_core: pelo critério
  # D3, fundação é o que os dois produtos compartilham, e hoje só este abre
  # documento. A casca já usa a mesma versão — se um terceiro consumidor
  # aparecer, aí sobe.
  syncfusion_flutter_pdfviewer: ^27.1.58
  # Renderização do corpo HTML do e-mail no "ver e-mail". Core basta: sem
  # vídeo/iframe — e-mail de cobrança é tabela, texto e imagem.
  flutter_widget_from_html_core: ^0.15.2
  # x-requestid das escritas — o backend deduplica pela mesma intenção.
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
