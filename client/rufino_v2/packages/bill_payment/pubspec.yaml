name: bill_payment
description: "Contas a pagar: captura, verificação, aprovação e expectativas."
publish_to: 'none'
version: 0.1.0

# Este pacote NÃO declara `people_management`, e é isso que garante o isolamento
# entre os dois produtos: importar de lá vira erro de compilação, não questão de
# disciplina. O que os dois precisam dividir sobe para `rufino_core`.
resolution: workspace

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  rufino_core: ^0.1.0
  # Mesmo conjunto de estado/DI/rotas do resto do app — a casca compõe os três.
  provider: ^6.1.2
  go_router: ^14.6.2
  http: ^1.2.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
