name: tenant_management
description: "Identidade do cliente da plataforma: seleção de contexto e back-office de tenants."
publish_to: 'none'
version: 0.1.0

# Este pacote NÃO declara `rufino_v2` nem `bill_payment`. O seletor de tenant é
# a porta de entrada do app inteiro, mas quem precisa saber qual tenant está
# selecionado lê o `TenantContext` de `rufino_core` — nunca este pacote. É o
# que impede o produto de contas a pagar de acabar dependendo do back-office.
resolution: workspace

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  rufino_core: ^0.1.0
  # Mesmo conjunto de estado/DI/rotas do resto do app — a casca compõe os três.
  provider: ^6.1.2
  go_router: ^14.6.2
  http: ^1.2.2
  intl: ^0.19.0
  # Idempotência das escritas: o backend deduplica pelo `x-requestid`.
  uuid: ^4.5.3
  mask_text_input_formatter: ^2.9.0
  material_symbols_icons: ^4.2815.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
