services:
  billpayment.api:
    image: ${DOCKER_REGISTRY-}billpaymentapi
    build:
      context: .
      dockerfile: BillPayment.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__BillPayment: "Host=billpayment.db;Port=5432;Database=BillPaymentDb;Username=admin;Password=5up3rS3nh@;Search Path=bill_payment"
    ports:
      - 8100:8080
    depends_on:
      billpayment.db:
        condition: service_healthy

  billpayment.db:
    image: postgres:17-alpine
    restart: always
    volumes:
      - billpayment-db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: "admin"
      POSTGRES_PASSWORD: "5up3rS3nh@"
      POSTGRES_DB: "BillPaymentDb"
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - 8102:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d BillPaymentDb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  billpayment-db:
